name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Generate seed data
        run: node scripts/gen-seed.mjs
      - run: npm install
      - run: npm run build
      - name: Dry-run x-scroll
        run: npm run agent:x-scroll
