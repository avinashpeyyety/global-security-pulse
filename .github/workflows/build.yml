name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      # Prefer richer public/data; gen-seed must not clobber ingested events
      - name: Generate seed data (preserve public events)
        run: node scripts/gen-seed.mjs
      - run: npm run build
      - name: Dry-run x-scroll
        run: npm run agent:x-scroll
